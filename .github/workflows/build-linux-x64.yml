name: Build Linux x64 Modules

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.2-linux-x64.2)'
        required: true
      cores:
        description: 'Optional comma-separated core IDs to build (empty = all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils cmake file curl g++-12 gcc-12 python3 \
            libgl1 libegl1 libgomp1
      - name: Build and verify modules
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_FILTER: ${{ inputs.cores }}
        run: |
          chmod +x ./scripts/build-linux-x64.sh
          ./scripts/build-linux-x64.sh
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          NOTES=$(python3 - <<'PY'
          import json, pathlib
          summary = json.loads(pathlib.Path("build/out/release-summary.json").read_text())
          lines = ["Linux x86_64 libretro modules for tico (verified ELF x86_64 + DT_NEEDED + dlopen/retro_init):", ""]
          for item in summary:
              mb = item["size"] / (1024 * 1024)
              src = item.get("source", "git")
              extra = f", {src}"
              if item.get("upstream_last_modified"):
                  extra += f" {item['upstream_last_modified']}"
              lines.append(f"- `{item['id']}` (`{item['version']}`{extra}) — `{item['filename']}` ({mb:.2f} MB)")
          print("\n".join(lines))
          PY
          )
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Linux x86_64 Modules (${TAG})" --notes "$NOTES"
          gh release upload "$TAG" build/out/*-linux-x64-module.zip build/out/release-summary.json --clobber
